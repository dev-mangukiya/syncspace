services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: syncspace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncspace_dev}
      POSTGRES_DB: ${POSTGRES_DB:-syncspace}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Redis 7 ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: syncspace-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── WebSocket + REST API Server (Go) ───────────────────────────
  ws-server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    container_name: syncspace-ws-server
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-syncspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncspace_dev}
      POSTGRES_DB: ${POSTGRES_DB:-syncspace}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ENV: ${ENV:-development}
      MIGRATIONS_DIR: /app/migrations
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      EXEC_SERVICE_SECRET: ${EXEC_SERVICE_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Execution Service ───────────────────────────────────────────
  # Runs natively on the host (requires Docker socket access for DinD)
  # Start with: cd exec-service && go run ./cmd/server
  # Or build: go build -o ./bin/exec-server ./cmd/server && ./bin/exec-server

  # ── Frontend (Next.js Dev Server) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: syncspace-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_WS_SERVER_URL: http://localhost:8080
      NEXT_PUBLIC_EXEC_SERVICE_URL: http://localhost:8081
      INTERNAL_WS_URL: http://ws-server:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      ws-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
  frontend_next:
